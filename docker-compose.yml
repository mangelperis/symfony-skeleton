version: '3.8'

services:
    php-fpm:
        env_file:
            - .env
        container_name: php-fpm
        #extra_hosts REQUIRED in Linux for xdebug!!
        extra_hosts:
            - host.docker.internal:host-gateway
        #######
        build:
            dockerfile: ./docker/php-fpm/Dockerfile
        volumes:
            - ${PATH_TO_SYMFONY_PROJECT}:/var/www
            - ${PATH_TO_DATA}/php-fpm:/var/log/php-fpm/
        networks:
            - symfony

    nginx:
        env_file:
            - .env
        container_name: nginx
        build:
            context: ./docker/nginx
        volumes:
            - ${PATH_TO_SYMFONY_PROJECT}:/var/www
            - ${PATH_TO_DATA}/nginx_logs:/var/log/nginx
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - php-fpm
        networks:
            - symfony

    mariadb:
        env_file:
            - .env
        container_name: mariadb
        build:
            context: ./docker/mariadb
        volumes:
            - ${PATH_TO_DATA}/mariadb_data:/var/lib/mysql:rw
            - ./docker/mariadb/mariadb.cnf:/etc/mysql/my.cnf
            # CUSTOM Users Script to add your users (optional)
            #- ./docker/mariadb/config/users.sql:/docker-entrypoint-initdb.d/users.sql
        environment:
            - MARIADB_ROOT_PASSWORD=${ROOT_PASSWORD}
            - MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=0
            #  - MARIADB_USER=${DB_USER}
            #  - MARIADB_PASSWORD=${DB_PASSWORD}
            - MARIADB_DATABASE=${DB_NAME}
        ports:
            - "3306:3306"
        networks:
            - symfony

